<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1060" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1600" height="1060" fill="#ffffff"/>

  <!-- Title block -->
  <text x="800" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#111">DIY USB DJ Controller — Signal Routing Schematic</text>
  <text x="800" y="56" text-anchor="middle" font-size="12" fill="#555">rev v2 · STM32F103C8T6 (Blue Pill) · full device↔pin list in PINOUT.md</text>
  <line x1="40" y1="70" x2="1560" y2="70" stroke="#111" stroke-width="1"/>

  <!-- Power rails -->
  <line x1="70" y1="110" x2="1530" y2="110" stroke="#b3261e" stroke-width="2.5"/>
  <text x="40" y="114" font-size="14" font-weight="700" fill="#b3261e">+3V3</text>
  <line x1="70" y1="980" x2="1530" y2="980" stroke="#111" stroke-width="2.5"/>
  <text x="40" y="984" font-size="14" font-weight="700" fill="#111">GND</text>

  <!-- ===================== MUX A (potentiometers) ===================== -->
  <rect x="300" y="150" width="190" height="260" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="395" y="178" text-anchor="middle" font-size="14" font-weight="700">MUX A</text>
  <text x="395" y="195" text-anchor="middle" font-size="11" fill="#333">CD74HC4067</text>
  <text x="395" y="210" text-anchor="middle" font-size="10" fill="#555">(13 potentiometers)</text>

  <!-- Mux A pins: left edge = channel inputs (to pots), right edge = control -->
  <!-- left pin stub (channel bus) -->
  <line x1="300" y1="260" x2="250" y2="260" stroke="#111" stroke-width="1.5"/>
  <text x="245" y="256" text-anchor="end" font-size="10">C0…C12</text>

  <!-- right pins: SIG, S0-S3, EN, VCC, GND -->
  <line x1="490" y1="175" x2="540" y2="175" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="171" font-size="10">SIG</text>
  <line x1="490" y1="200" x2="540" y2="200" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="196" font-size="10">S0</text>
  <line x1="490" y1="220" x2="540" y2="220" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="216" font-size="10">S1</text>
  <line x1="490" y1="240" x2="540" y2="240" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="236" font-size="10">S2</text>
  <line x1="490" y1="260" x2="540" y2="260" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="256" font-size="10">S3</text>

  <!-- EN tied low -->
  <line x1="490" y1="340" x2="520" y2="340" stroke="#111" stroke-width="1.5"/>
  <text x="497" y="336" font-size="10">EN</text>
  <line x1="520" y1="340" x2="520" y2="980" stroke="#111" stroke-width="1"/>
  <circle cx="520" cy="980" r="2.5" fill="#111"/>

  <!-- VCC up to rail, with decoupling cap -->
  <line x1="340" y1="150" x2="340" y2="110" stroke="#b3261e" stroke-width="1.5"/>
  <circle cx="340" cy="110" r="2.5" fill="#b3261e"/>
  <text x="345" y="140" font-size="10" fill="#b3261e">VCC</text>
  <!-- decoupling cap symbol near VCC -->
  <line x1="340" y1="130" x2="315" y2="130" stroke="#111" stroke-width="1"/>
  <line x1="315" y1="122" x2="315" y2="138" stroke="#111" stroke-width="2"/>
  <line x1="307" y1="122" x2="307" y2="138" stroke="#111" stroke-width="2"/>
  <line x1="307" y1="130" x2="307" y2="160" stroke="#111" stroke-width="1"/>
  <line x1="307" y1="160" x2="307" y2="980" stroke="#111" stroke-width="1"/>
  <text x="298" y="118" text-anchor="end" font-size="9" fill="#555">100nF</text>

  <!-- GND down to rail -->
  <line x1="450" y1="410" x2="450" y2="980" stroke="#111" stroke-width="1.5"/>
  <text x="455" y="400" font-size="10">GND</text>

  <!-- Representative potentiometer symbol, fed into Mux A channel bus -->
  <g>
    <rect x="80" y="236" width="50" height="22" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <line x1="80" y1="247" x2="60" y2="247" stroke="#111" stroke-width="1.5"/>
    <line x1="130" y1="247" x2="150" y2="247" stroke="#111" stroke-width="1.5"/>
    <line x1="105" y1="258" x2="105" y2="275" stroke="#111" stroke-width="1.5"/>
    <line x1="92" y1="233" x2="118" y2="258" stroke="#111" stroke-width="1.5"/>
    <polygon points="118,258 112,255 115,250" fill="#111"/>
    <line x1="60" y1="247" x2="60" y2="110" stroke="#b3261e" stroke-width="1"/>
    <line x1="105" y1="275" x2="105" y2="980" stroke="#111" stroke-width="1"/>
    <line x1="150" y1="247" x2="250" y2="260" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="105" y="296" text-anchor="middle" font-size="10" fill="#333">×13 potentiometers</text>
  <text x="105" y="309" text-anchor="middle" font-size="9" fill="#777">(Gain/Bass/Mid/Treble/FX×2 decks + Master)</text>
  <text x="105" y="222" text-anchor="middle" font-size="9" fill="#777">3 leads each: +3V3 / wiper / GND</text>

  <!-- ===================== MUX B (sliders) ===================== -->
  <rect x="1110" y="150" width="190" height="220" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="1205" y="178" text-anchor="middle" font-size="14" font-weight="700">MUX B</text>
  <text x="1205" y="195" text-anchor="middle" font-size="11" fill="#333">CD74HC4067</text>
  <text x="1205" y="210" text-anchor="middle" font-size="10" fill="#555">(5 sliders)</text>

  <line x1="1300" y1="260" x2="1350" y2="260" stroke="#111" stroke-width="1.5"/>
  <text x="1355" y="256" font-size="10">C0…C4</text>

  <line x1="1060" y1="175" x2="1110" y2="175" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="171" font-size="10">SIG</text>
  <line x1="1060" y1="200" x2="1110" y2="200" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="196" font-size="10">S0</text>
  <line x1="1060" y1="220" x2="1110" y2="220" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="216" font-size="10">S1</text>
  <line x1="1060" y1="240" x2="1110" y2="240" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="236" font-size="10">S2</text>
  <line x1="1060" y1="260" x2="1110" y2="260" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="256" font-size="10">S3</text>

  <line x1="1110" y1="300" x2="1080" y2="300" stroke="#111" stroke-width="1.5"/>
  <text x="1065" y="296" font-size="10">EN</text>
  <line x1="1080" y1="300" x2="1080" y2="980" stroke="#111" stroke-width="1"/>
  <circle cx="1080" cy="980" r="2.5" fill="#111"/>

  <line x1="1160" y1="150" x2="1160" y2="110" stroke="#b3261e" stroke-width="1.5"/>
  <circle cx="1160" cy="110" r="2.5" fill="#b3261e"/>
  <text x="1140" y="140" font-size="10" fill="#b3261e" text-anchor="end">VCC</text>
  <line x1="1160" y1="130" x2="1185" y2="130" stroke="#111" stroke-width="1"/>
  <line x1="1185" y1="122" x2="1185" y2="138" stroke="#111" stroke-width="2"/>
  <line x1="1193" y1="122" x2="1193" y2="138" stroke="#111" stroke-width="2"/>
  <line x1="1193" y1="130" x2="1193" y2="160" stroke="#111" stroke-width="1"/>
  <line x1="1193" y1="160" x2="1193" y2="980" stroke="#111" stroke-width="1"/>
  <text x="1202" y="118" font-size="9" fill="#555">100nF</text>

  <line x1="1250" y1="370" x2="1250" y2="980" stroke="#111" stroke-width="1.5"/>
  <text x="1210" y="360" font-size="10">GND</text>

  <!-- Representative slider symbol -->
  <g>
    <rect x="1420" y="210" width="22" height="70" fill="#fff" stroke="#111" stroke-width="1.5"/>
    <rect x="1414" y="238" width="34" height="12" fill="#eee" stroke="#111" stroke-width="1.5"/>
    <line x1="1431" y1="210" x2="1431" y2="110" stroke="#b3261e" stroke-width="1"/>
    <line x1="1431" y1="280" x2="1431" y2="980" stroke="#111" stroke-width="1"/>
    <line x1="1448" y1="244" x2="1350" y2="260" stroke="#111" stroke-width="1.5"/>
  </g>
  <text x="1431" y="300" text-anchor="middle" font-size="10" fill="#333">×5 sliders</text>
  <text x="1431" y="313" text-anchor="middle" font-size="9" fill="#777">(2× pitch, 2× ch. fader, crossfader)</text>

  <!-- ===================== Shared address bus S0-S3 ===================== -->
  <line x1="540" y1="175" x2="760" y2="175" stroke="#111" stroke-width="1.2" stroke-dasharray="1,0"/>
  <line x1="540" y1="200" x2="760" y2="200" stroke="#111" stroke-width="1.2"/>
  <line x1="540" y1="220" x2="760" y2="220" stroke="#111" stroke-width="1.2"/>
  <line x1="540" y1="240" x2="760" y2="240" stroke="#111" stroke-width="1.2"/>
  <line x1="840" y1="175" x2="1060" y2="175" stroke="#111" stroke-width="1.2"/>
  <line x1="840" y1="200" x2="1060" y2="200" stroke="#111" stroke-width="1.2"/>
  <line x1="840" y1="220" x2="1060" y2="220" stroke="#111" stroke-width="1.2"/>
  <line x1="840" y1="240" x2="1060" y2="240" stroke="#111" stroke-width="1.2"/>
  <text x="800" y="160" text-anchor="middle" font-size="9" fill="#777">shared address bus (S0–S3 → both MUX A and MUX B)</text>

  <!-- ===================== STM32 Blue Pill ===================== -->
  <rect x="650" y="420" width="300" height="300" fill="#fff" stroke="#111" stroke-width="2.5"/>
  <text x="800" y="460" text-anchor="middle" font-size="16" font-weight="700">STM32F103C8T6</text>
  <text x="800" y="478" text-anchor="middle" font-size="12" fill="#555">("Blue Pill")</text>

  <!-- left pins: analog + address bus, bent down from the bus lines above -->
  <line x1="760" y1="175" x2="760" y2="420" stroke="#111" stroke-width="1.2"/>
  <text x="700" y="437" font-size="11" text-anchor="end">PA0 (ADC12_IN0) — MUX A SIG</text>
  <line x1="650" y1="437" x2="760" y2="437" stroke="#111" stroke-width="1.5"/>

  <line x1="840" y1="175" x2="840" y2="420" stroke="#111" stroke-width="1.2"/>
  <text x="700" y="461" font-size="11" text-anchor="end">PA1 (ADC12_IN1) — MUX B SIG</text>
  <line x1="650" y1="461" x2="840" y2="461" stroke="#111" stroke-width="1.5"/>

  <text x="700" y="485" font-size="11" text-anchor="end">PB12 — S0</text>
  <line x1="650" y1="485" x2="650" y2="485" stroke="#111" stroke-width="1.5"/>
  <text x="700" y="505" font-size="11" text-anchor="end">PB13 — S1</text>
  <text x="700" y="525" font-size="11" text-anchor="end">PB14 — S2</text>
  <text x="700" y="545" font-size="11" text-anchor="end">PB15 — S3</text>

  <!-- VCC/GND of STM32 to rails -->
  <line x1="720" y1="420" x2="720" y2="110" stroke="#b3261e" stroke-width="1.5"/>
  <circle cx="720" cy="110" r="2.5" fill="#b3261e"/>
  <text x="725" y="410" font-size="10" fill="#b3261e">3V3 out</text>
  <line x1="780" y1="720" x2="780" y2="980" stroke="#111" stroke-width="1.5"/>
  <circle cx="780" cy="980" r="2.5" fill="#111"/>
  <text x="785" y="715" font-size="10">GND</text>

  <!-- USB -->
  <rect x="770" y="330" width="60" height="26" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="800" y="347" text-anchor="middle" font-size="10" font-weight="700">USB</text>
  <line x1="800" y1="330" x2="800" y2="300" stroke="#111" stroke-width="1.5"/>
  <text x="800" y="294" text-anchor="middle" font-size="10">to host (MIDI)</text>

  <!-- Reserved pins note -->
  <text x="800" y="700" text-anchor="middle" font-size="10" fill="#777" font-style="italic">reserved (not on this diagram): PA8–10 UART1, PA11/12 USB D-/D+, PA13/14 SWDIO/SWCLK, PD0/PD1 crystal</text>

  <!-- ===================== Buttons row ===================== -->
  <text x="800" y="765" text-anchor="middle" font-size="11" fill="#333">15× momentary buttons — direct GPIO, one leg to GND, internal pull-up</text>

  <!-- 3 representative buttons -->
  <g>
    <!-- btn 1 -->
    <line x1="700" y1="800" x2="700" y2="720" stroke="#111" stroke-width="1.5"/>
    <circle cx="700" cy="800" r="3" fill="#111"/>
    <line x1="692" y1="812" x2="708" y2="812" stroke="#111" stroke-width="2"/>
    <line x1="700" y1="800" x2="700" y2="812" stroke="#111" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="700" cy="824" r="3" fill="#111"/>
    <line x1="700" y1="812" x2="700" y2="824" stroke="#111" stroke-width="1.5"/>
    <line x1="700" y1="824" x2="700" y2="980" stroke="#111" stroke-width="1.5"/>
    <text x="700" y="845" text-anchor="middle" font-size="9">PA2</text>
    <!-- btn 2 -->
    <line x1="780" y1="800" x2="780" y2="720" stroke="#111" stroke-width="1.5"/>
    <circle cx="780" cy="800" r="3" fill="#111"/>
    <line x1="772" y1="812" x2="788" y2="812" stroke="#111" stroke-width="2"/>
    <line x1="780" y1="800" x2="780" y2="812" stroke="#111" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="780" cy="824" r="3" fill="#111"/>
    <line x1="780" y1="812" x2="780" y2="824" stroke="#111" stroke-width="1.5"/>
    <line x1="780" y1="824" x2="780" y2="980" stroke="#111" stroke-width="1.5"/>
    <text x="780" y="845" text-anchor="middle" font-size="9">PA3</text>
    <!-- btn 3 -->
    <line x1="860" y1="800" x2="860" y2="720" stroke="#111" stroke-width="1.5"/>
    <circle cx="860" cy="800" r="3" fill="#111"/>
    <line x1="852" y1="812" x2="868" y2="812" stroke="#111" stroke-width="2"/>
    <line x1="860" y1="800" x2="860" y2="812" stroke="#111" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="860" cy="824" r="3" fill="#111"/>
    <line x1="860" y1="812" x2="860" y2="824" stroke="#111" stroke-width="1.5"/>
    <line x1="860" y1="824" x2="860" y2="980" stroke="#111" stroke-width="1.5"/>
    <text x="860" y="845" text-anchor="middle" font-size="9">PA4</text>
  </g>
  <text x="940" y="815" font-size="18" fill="#555">…</text>
  <text x="940" y="845" font-size="10" fill="#555">+ 12 more → PA5–PA7, PB3–PB11</text>
  <text x="800" y="875" text-anchor="middle" font-size="10" fill="#777">full button→pin list in PINOUT.md</text>

  <!-- ===================== Legend ===================== -->
  <rect x="70" y="900" width="420" height="140" fill="#fff" stroke="#111" stroke-width="1"/>
  <text x="85" y="920" font-size="11" font-weight="700">LEGEND</text>

  <line x1="90" y1="940" x2="110" y2="940" stroke="#111" stroke-width="1.5"/>
  <circle cx="90" cy="940" r="2.5" fill="#111"/>
  <line x1="90" y1="940" x2="90" y2="950" stroke="#111" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="90" cy="952" r="2.5" fill="#111"/>
  <text x="120" y="950" font-size="10">momentary push button</text>

  <rect x="85" y="965" width="30" height="14" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <line x1="90" y1="975" x2="108" y2="968" stroke="#111" stroke-width="1.2"/>
  <text x="120" y="977" font-size="10">rotary potentiometer (linear)</text>

  <rect x="85" y="990" width="16" height="22" fill="#eee" stroke="#111" stroke-width="1.2"/>
  <text x="120" y="1005" font-size="10">slide potentiometer</text>

  <line x1="280" y1="940" x2="280" y2="952" stroke="#111" stroke-width="2"/>
  <line x1="290" y1="940" x2="290" y2="952" stroke="#111" stroke-width="2"/>
  <text x="300" y="950" font-size="10">decoupling capacitor (100nF)</text>

  <line x1="280" y1="970" x2="300" y2="970" stroke="#b3261e" stroke-width="2"/>
  <text x="305" y="974" font-size="10" fill="#b3261e">+3.3V rail</text>
  <line x1="280" y1="990" x2="300" y2="990" stroke="#111" stroke-width="2"/>
  <text x="305" y="994" font-size="10">GND rail</text>

  <text x="800" y="1040" text-anchor="middle" font-size="10" fill="#999">diy-dj-controller · schematic.svg</text>
</svg>
