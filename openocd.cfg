# OpenOCD config: ST-Link V2 (SWD) -> STM32F103C8T6 "Blue Pill".
# Used by the CLion "OpenOCD Download & Run" configuration (see FLASHING.md).
# Manual use:  openocd -f openocd.cfg -c "program build/Debug/dj.elf verify reset exit"

source [find interface/stlink.cfg]
transport select hla_swd

# Many Blue Pills carry a clone chip (CKS32/CS32/APM32) with a different SWD
# IDCODE; 0 makes OpenOCD accept any ID instead of refusing to connect.
set CPUTAPID 0

source [find target/stm32f1x.cfg]

# Cheap ST-Link clones do not wire their RST pin, so reset over SWD only
reset_config none
